# ntfy server for the relay. The image comes from the release tarball and
# carries the stable local tag:
#   podman load -i ntfy-image-<version>-amd64.tar
#   docker load -i ntfy-image-<version>-amd64.tar
# The relay itself runs on the host, not here; it needs the OpenCode
# registration, the token file, and the project roots.
services:
  ntfy:
    image: localhost/ntfy:server
    container_name: ntfy
    command: ["serve"]
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    restart: unless-stopped
    # The proxy route expects loopback; a LAN deployment sets NTFY_BIND to a
    # private address, which is outside the proxy rule.
    ports:
      - "${NTFY_BIND:-127.0.0.1}:${NTFY_PORT:-8810}:8080"
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:?set NTFY_BASE_URL in .env}
      NTFY_BEHIND_PROXY: ${NTFY_BEHIND_PROXY:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ntfy-cache:
    name: ntfy-cache
