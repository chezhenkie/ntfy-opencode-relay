[workspace]
resolver = "2"
members = ["crates/core", "crates/inbound", "crates/ntfy", "crates/opencode", "crates/outbound", "crates/control", "crates/app", "crates/deploy", "crates/auth", "crates/admin"]

[workspace.package]
version = "0.6.13"
edition = "2021"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
