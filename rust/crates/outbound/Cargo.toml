[package]
name = "ntfy-relay-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ntfy-relay-core = { path = "../core" }
ntfy-relay-ntfy = { path = "../ntfy" }
ntfy-relay-opencode = { path = "../opencode" }
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
